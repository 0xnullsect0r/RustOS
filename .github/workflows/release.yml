name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-image:
    name: Build Bootable Disk Image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust + components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install bootimage
        run: cargo install bootimage

      - name: Build kernel with bootimage
        run: cargo bootimage --release

      - name: Locate disk image
        id: bins
        run: |
          BIN=$(find target -name "bootimage-rustos.bin" | head -1)
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename image with version
        run: cp "${{ steps.bins.outputs.bin }}" rustos-${{ steps.tag.outputs.tag }}.img

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustos-img
          path: rustos-${{ steps.tag.outputs.tag }}.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RustOS ${{ steps.tag.outputs.tag }}
          body: |
            ## RustOS ${{ steps.tag.outputs.tag }}

            ### Download
            - **`rustos-${{ steps.tag.outputs.tag }}.img`** — raw x86_64 disk image (BIOS bootloader)

            ### Booting from USB (recommended)

            Write the image directly to a USB drive — this is the most reliable method:

            **Linux / macOS:**
            ```bash
            sudo dd if=rustos-${{ steps.tag.outputs.tag }}.img of=/dev/sdX bs=4M status=progress && sync
            ```
            Replace `/dev/sdX` with your USB device (e.g. `/dev/sdb`). **Do NOT use a partition** (e.g. `/dev/sdb1`).

            **Windows (Rufus):** Open Rufus, select the `.img` file, choose "DD image" mode.

            Then boot your PC from that USB drive. In your BIOS/UEFI settings, enable **Legacy/CSM boot** or **BIOS compatibility mode** (this kernel uses a BIOS bootloader; UEFI-only systems require CSM).

            ### Testing in QEMU
            ```bash
            qemu-system-x86_64 \
              -drive format=raw,file=rustos-${{ steps.tag.outputs.tag }}.img \
              -device qemu-xhci,id=xhci \
              -drive if=none,id=usbdisk,file=YOUR_FAT32_DISK.img,format=raw \
              -device usb-storage,bus=xhci.0,drive=usbdisk \
              -serial stdio
            ```

            ### What's in this release
            - Interactive shell (`help`, `ls`, `cd`, `cat`, `write`, `cp`, `mv`, `exec`, `usbscan`, …)
            - ELF64 process loader — run programs from USB with `exec /usb/yourprogram`
            - USB mass storage (XHCI) — plug in a USB drive and run `usbscan` to mount it at `/usb`
            - FAT32 read support for USB drives
            - VGA text mode, async keyboard input
            - Heap allocator, interrupt handling (IDT/GDT/PIC)
          files: rustos-${{ steps.tag.outputs.tag }}.img
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
